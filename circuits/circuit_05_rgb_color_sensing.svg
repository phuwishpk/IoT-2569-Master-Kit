<text x="45" y="78" class="subtitle">แสดงขาทั้งหมดของ ESP32 (ครบ 38 ขา) พร้อมต่อหลอดไฟแม่สี 3 สี (ผ่าน R 220Ω) และรับแสงสะท้อนผ่านเซนเซอร์ LDR</text>
