space" font-weight="normal" fill="#adb5bd">GND</text>  <circle cx="8" cy="475" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="479" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G13</text>  <circle cx="8" cy="505" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="509" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D2</text>  <circle cx="8" cy="535" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="539" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D3</text>  <circle cx="8" cy="565" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="569" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">CMD</text>  <circle cx="8" cy="595" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="599" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">5V</text>  <circle cx="252" cy="55" r="5" fill="#212529" stroke="#212529" stroke-width="1.5" />  <text x="240" y="59" text-anchor="end" font-size="12px" font-family="monospace" font-weight="bold" fill="#ffffff">GND</text>  <circle cx="252" cy="85" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="89" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G23</text>  <circle cx="252" cy="115" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="119" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G22</text>  <circle cx="252" cy="145" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="149" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">TX</text>  <circle cx="252" cy="175" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="179" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">RX</text>  <circle cx="252" cy="205" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="209" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G21</text>  <circle cx="252" cy="235" r="5" fill="#212529" stroke="#212529" stroke-width="1.5" />  <text x="240" y="239" text-anchor="end" font-size="12px" font-family="monospace" font-weight="bold" fill="#ffffff">GND</text>  <circle cx="252" cy="265" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="269" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G19</text>  <circle cx="252" cy="295" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="299" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G18</text>  <circle cx="252" cy="325" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="329" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G5</text>  <circle cx="252" cy="355" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="359" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">TX2</text>  <circle cx="252" cy="385" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="389" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">RX2</text>  <circle cx="252" cy="415" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="419" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G4</text>  <circle cx="252" cy="445" r="5" fill="#fd7e14" stroke="#212529" stroke-width="1.5" />  <text x="240" y="449" text-anchor="end" font-size="12px" font-family="monospace" font-weight="bold" fill="#ffffff">G2</text>  <circle cx="252" cy="475" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="479" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G15</text>  <circle cx="252" cy="505" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="509" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D1</text>  <circle cx="252" cy="535" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="539" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D0</text>  <circle cx="252" cy="565" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="569" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">CLK</text>  <circle cx="252" cy="595" r="5" fill="#212529" stroke="#212529" stroke-width="1.5" />  <text x="240" y="599" text-anchor="end" font-size="12px" font-family="monospace" font-weight="bold" fill="#ffffff">GND</text></g>

<!-- Breadboard Layout -->
<g transform="translate(420, 150)">
  <rect x="0" y="0" width="450" height="600" rx="12" fill="#f1f3f5" stroke="#ced4da" stroke-width="2" />
  <text x="180" y="30" font-size="14px" font-weight="bold" fill="#adb5bd">BREADBOARD</text>
  
  <!-- LED + Resistor Box -->
  <g transform="translate(125, 100)">
    <rect x="0" y="0" width="200" height="300" rx="8" fill="#ffffff" stroke="#dee2e6" />
    <circle cx="100" cy="80" r="40" fill="#dc3545" opacity="0.9" />
    <polygon points="75,115 125,115 100,145" fill="#dc3545" />
    <text x="100" y="180" text-anchor="middle" font-size="15px" font-weight="bold" fill="#212529">LED (Red / Blue)</text>
    
    <!-- Resistor 220 Ohm -->
    <rect x="65" y="200" width="70" height="24" rx="4" fill="#e2d9cc" stroke="#8b7355" stroke-width="2" />
    <line x1="77" y1="200" x2="77" y2="224" stroke="#dc3545" stroke-width="3.5" />
    <line x1="90" y1="200" x2="90" y2="224" stroke="#dc3545" stroke-width="3.5" />
    <line x1="103" y1="200" x2="103" y2="224" stroke="#8b4513" stroke-width="3.5" />
    <text x="100" y="245" text-anchor="middle" font-size="12px" font-weight="bold" fill="#8b4513">R 220Ω (แดง-แดง-น้ำตาล)</text>
    
    <!-- Terminals -->
    <circle cx="75" cy="275" r="7" fill="#fd7e14" /><text x="75" y="295" text-anchor="middle" font-size="11px" fill="#fd7e14">Anode (+)</text>
    <circle cx="125" cy="275" r="6" fill="#212529" /><text x="125" y="295" text-anchor="middle" font-size="11px" fill="#212529">Cathode (-)</text>
  </g>
</g>

<!-- Wire Routing -->
<!-- GPIO 2 Pad -> Resistor Anode -->
<path d="M 312 585 L 350 585 L 350 525 L 620 525 L 620 425" stroke="#fd7e14" stroke-width="4.5" class="wire" />
<circle cx="312" cy="585" r="3" fill="#ffffff" />

<!-- GND Right Pad -> LED Cathode -->
<path d="M 312 735 L 330 735 L 330 550 L 670 550 L 670 425" stroke="#212529" stroke-width="4.5" class="wire" />
<circle cx="312" cy="735" r="3" fill="#ffffff" />

