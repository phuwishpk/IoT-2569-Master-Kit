<!-- Header Card -->
<rect x="25" y="20" width="1230" height="100" class="card" />
<text x="45" y="52" class="title">วงจรที่ 1: ผังขาบอร์ด ESP32 ฉบับสมบูรณ์ (Full 38-Pin Master Reference)</text>
<text x="45" y="78" class="subtitle">แสดงขาทั้งหมดของ ESP32 NodeMCU-32S ครบทั้ง 38 ขา (ฝั่งซ้าย 19 ขา + ฝั่งขวา 19 ขา) พร้อมกลุ่มหน้าที่และฟังก์ชันพิเศษ</text>
<text x="45" y="102" class="badge-lab">📌 ใช้งานแบบบอร์ดเปล่า (เสียบสาย USB ไม่ต้องต่อ Breadboard) สำหรับ: Week 01, Week 05, Week 06, Week 07, Week 08</text>

<!-- ESP32 Board (Full 38 Pins) -->
<g transform="translate(100, 140)">  <rect x="0" y="0" width="260" height="670" rx="14" fill="#1e222b" stroke="#3e4451" stroke-width="2.5" />  <rect x="45" y="45" width="170" height="190" rx="6" fill="#ced4da" stroke="#adb5bd" stroke-width="2" />  <text x="130" y="115" text-anchor="middle" font-size="14px" font-weight="bold" fill="#212529">ESP-WROOM-32</text>  <text x="130" y="138" text-anchor="middle" font-size="11px" fill="#495057">Wi-Fi &amp; Bluetooth</text>  <text x="130" y="158" text-anchor="middle" font-size="10px" font-family="monospace" fill="#6c757d">240MHz DUAL CORE</text>  <rect x="102" y="648" width="56" height="26" rx="4" fill="#adb5bd" stroke="#6c757d" stroke-width="1.5" />  <text x="130" y="664" text-anchor="middle" font-size="10px" font-weight="bold" fill="#212529">USB</text>  <rect x="25" y="605" width="24" height="20" rx="3" fill="#dc3545" />  <text x="37" y="598" text-anchor="middle" font-size="10px" font-weight="bold" fill="#adb5bd">EN</text>  <rect x="211" y="605" width="24" height="20" rx="3" fill="#495057" />  <text x="223" y="598" text-anchor="middle" font-size="10px" font-weight="bold" fill="#adb5bd">BOOT</text>  <rect x="200" y="560" width="12" height="8" rx="2" fill="#0d6efd" stroke="#0b5ed7" />  <text x="206" y="552" text-anchor="middle" font-size="9px" fill="#0dcaf0">LED:D2</text>  <circle cx="8" cy="55" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="59" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">3V3</text>  <circle cx="8" cy="85" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="89" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">EN</text>  <circle cx="8" cy="115" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="119" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">VP</text>  <circle cx="8" cy="145" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="149" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">VN</text>  <circle cx="8" cy="175" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="179" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G34</text>  <circle cx="8" cy="205" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="209" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G35</text>  <circle cx="8" cy="235" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="239" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G32</text>  <circle cx="8" cy="265" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="269" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G33</text>  <circle cx="8" cy="295" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="299" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G25</text>  <circle cx="8" cy="325" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="329" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G26</text>  <circle cx="8" cy="355" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="359" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G27</text>  <circle cx="8" cy="385" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="389" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G14</text>  <circle cx="8" cy="415" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="419" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G12</text>  <circle cx="8" cy="445" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="449" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">GND</text>  <circle cx="8" cy="475" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="479" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G13</text>  <circle cx="8" cy="505" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="509" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D2</text>  <circle cx="8" cy="535" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="539" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D3</text>  <circle cx="8" cy="565" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="569" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">CMD</text>  <circle cx="8" cy="595" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="599" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">5V</text>  <circle cx="252" cy="55" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="59" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">GND</text>  <circle cx="252" cy="85" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="89" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G23</text>  <circle cx="252" cy="115" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="119" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G22</text>  <circle cx="252" cy="145" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="149" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">TX</text>  <circle cx="252" cy="175" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="179" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">RX</text>  <circle cx="252" cy="205" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="209" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G21</text>  <circle cx="252" cy="235" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="239" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">GND</text>  <circle cx="252" cy="265" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="269" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G19</text>  <circle cx="252" cy="295" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="299" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G18</text>  <circle cx="252" cy="325" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="329" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G5</text>  <circle cx="252" cy="355" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="359" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">TX2</text>  <circle cx="252" cy="385" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="389" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">RX2</text>  <circle cx="252" cy="415" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="419" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G4</text>  <circle cx="252" cy="445" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="449" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G2</text>  <circle cx="252" cy="475" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="479" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G15</text>  <circle cx="252" cy="505" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="509" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D1</text>  <circle cx="252" cy="535" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="539" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D0</text>  <circle cx="252" cy="565" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="569" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">CLK</text>  <circle cx="252" cy="595" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="599" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">GND</text></g>

<!-- Right Side Pin Function Explanations -->
<g transform="translate(420, 140)">
  <rect x="0" y="0" width="835" height="700" rx="12" class="card" />
  <text x="30" y="38" font-size="18px" font-weight="bold" fill="#0d6efd">📖 คู่มือหน้าที่ของแต่ละขาบนบอร์ด ESP32 (Pin Function Reference)</text>
  
  <g transform="translate(30, 65)">
    <!-- Group 1: Power & Reset -->
    <rect x="0" y="0" width="775" height="85" rx="6" fill="#f8f9fa" stroke="#dee2e6" />
    <text x="15" y="25" font-size="14px" font-weight="bold" fill="#dc3545">1. ไฟเลี้ยงและรีเซ็ต (Power &amp; Control Pins):</text>
    <text x="15" y="48" font-size="13px" fill="#212529">• <tspan font-weight="bold">3V3:</tspan> แรงดันเอาต์พุต 3.3V จากรกูเลเตอร์บนบอร์ด (ใช้จ่ายไฟให้เซนเซอร์และจอภาพ OLED)</text>
    <text x="15" y="70" font-size="13px" fill="#212529">• <tspan font-weight="bold">5V / VIN:</tspan> ไฟเลี้ยงหลัก 5V จากพอร์ต USB | <tspan font-weight="bold">GND:</tspan> กราวด์ระบบ (มี 4 ตำแหน่งบนบอร์ด) | <tspan font-weight="bold">EN:</tspan> สั่งรีเซ็ตฮาร์ดแวร์</text>

    <!-- Group 2: ADC1 vs ADC2 -->
    <rect x="0" y="100" width="775" height="115" rx="6" fill="#e7f1ff" stroke="#b6d4fe" />
    <text x="15" y="25" font-size="14px" font-weight="bold" fill="#0d6efd">2. ขาแอนะล็อกอินพุต (Analog-to-Digital Converter - ADC):</text>
    <text x="15" y="48" font-size="13px" fill="#0d6efd">• <tspan font-weight="bold">ADC1 (GPIO 32, 33, 34, 35, 36/VP, 39/VN):</tspan> **ปลอดภัยสูงสุด** ใช้งานได้ตลอดเวลา ไม่กวน Wi-Fi</text>
    <text x="25" y="70" font-size="12px" fill="#495057">&rarr; แล็บในวิชานี้กำหนดให้ใช้ <tspan font-weight="bold" fill="#0d6efd">GPIO 34 (ADC1_CH6)</tspan> เป็นหลักสำหรับ Potentiometer และ LDR</text>
    <text x="15" y="95" font-size="13px" fill="#6c757d">• <tspan font-weight="bold">ADC2 (GPIO 0, 2, 4, 12-15, 25-27):</tspan> ห้ามใช้อ่านแอนะล็อกขณะเปิด Wi-Fi (Wi-Fi Driver จะจองบล็อก ADC2)</text>

    <!-- Group 3: High-speed SPI Buses -->
    <rect x="0" y="230" width="775" height="95" rx="6" fill="#f8f9fa" stroke="#dee2e6" />
    <text x="15" y="25" font-size="14px" font-weight="bold" fill="#198754">3. บัสสื่อสารความเร็วสูง SPI2 (VSPI) สำหรับจอภาพกราฟิก (Week 09):</text>
    <text x="15" y="48" font-size="13px" fill="#212529">• <tspan font-weight="bold">GPIO 18 (VSPI_CLK):</tspan> สัญญาณนาฬิกา D0 | <tspan font-weight="bold">GPIO 23 (VSPI_MOSI):</tspan> ข้อมูลส่งออก D1</text>
    <text x="15" y="70" font-size="13px" fill="#212529">• <tspan font-weight="bold">GPIO 5 (VSPI_CS):</tspan> Chip Select | <tspan font-weight="bold">GPIO 4:</tspan> Hardware Reset (RES) | <tspan font-weight="bold">GPIO 2:</tspan> Data/Command (DC)</text>

    <!-- Group 4: Actuator GPIO 2 -->
    <rect x="0" y="340" width="775" height="80" rx="6" fill="#fff3cd" stroke="#ffecb5" />
    <text x="15" y="25" font-size="14px" font-weight="bold" fill="#664d03">4. ขาควบคุม Actuator (GPIO 2 - Onboard Blue LED):</text>
    <text x="15" y="48" font-size="13px" fill="#212529">• เป็นขาต่อขนานอยู่กับหลอดไฟสีน้ำเงินบนบอร์ด NodeMCU-32S ใช้ทดสอบไฟกระพริบใน Week 02</text>
    <text x="15" y="68" font-size="13px" fill="#212529">• ใช้เป็น Actuator สั่งเปิด-ปิดไฟผ่านเครือข่ายใน Week 10 (HTTP/CoAP), Week 11 (MQTT), และ Week 12 (Flutter)</text>

    <!-- Group 5: Strapping Pins Warning -->
    <rect x="0" y="435" width="775" height="85" rx="6" fill="#f8d7da" stroke="#f5c2c7" />
    <text x="15" y="25" font-size="14px" font-weight="bold" fill="#842029">⚠️ ขาต้องห้ามระวังพิเศษ (Strapping Pins):</text>
    <text x="15" y="48" font-size="13px" fill="#842029">• <tspan font-weight="bold">GPIO 0, GPIO 2, GPIO 12, GPIO 15:</tspan> เป็นขาตั้งค่าโหมดบูตของชิป ESP32</text>
    <text x="15" y="70" font-size="13px" fill="#842029">• ห้ามต่อดึงลอจิกค้างลงกราวด์ตอนบูต เพราะอาจทำให้บอร์ดเข้าโหมดแฟลชไม่สำเร็จ หรือรีบูตวนซ้ำ</text>

    <!-- Group 6: Summary for Friends -->
    <rect x="0" y="535" width="775" height="80" rx="6" fill="#d1e7dd" stroke="#a3cfbb" />
    <text x="15" y="25" font-size="14px" font-weight="bold" fill="#0f5132">🚀 กฎเหล็กจำง่ายในการต่อวงจรทั้ง 12 สัปดาห์:</text>
    <text x="15" y="48" font-size="13px" font-weight="bold" fill="#0f5132">1. จำแค่ 2 ขาหลัก: เซนเซอร์แอนะล็อกต่อ "GPIO 34" เสมอ | สวิตช์หลอดไฟต่อ "GPIO 2" เสมอ</text>
    <text x="15" y="68" font-size="13px" fill="#0f5132">2. จ่ายไฟให้เซนเซอร์จากขา "3.3V" เท่านั้น (ห้ามต่อขา 5V เข้าเซนเซอร์เด็ดขาด)</text>
  </g>
</g>
</svg>
