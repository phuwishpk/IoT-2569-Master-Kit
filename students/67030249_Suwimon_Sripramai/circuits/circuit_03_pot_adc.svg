e" font-weight="bold" fill="#ffffff">GND</text>  <circle cx="8" cy="475" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="479" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G13</text>  <circle cx="8" cy="505" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="509" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D2</text>  <circle cx="8" cy="535" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="539" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D3</text>  <circle cx="8" cy="565" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="569" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">CMD</text>  <circle cx="8" cy="595" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="20" y="599" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">5V</text>  <circle cx="252" cy="55" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="59" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">GND</text>  <circle cx="252" cy="85" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="89" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G23</text>  <circle cx="252" cy="115" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="119" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G22</text>  <circle cx="252" cy="145" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="149" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">TX</text>  <circle cx="252" cy="175" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="179" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">RX</text>  <circle cx="252" cy="205" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="209" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G21</text>  <circle cx="252" cy="235" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="239" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">GND</text>  <circle cx="252" cy="265" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="269" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G19</text>  <circle cx="252" cy="295" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="299" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G18</text>  <circle cx="252" cy="325" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="329" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G5</text>  <circle cx="252" cy="355" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="359" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">TX2</text>  <circle cx="252" cy="385" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="389" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">RX2</text>  <circle cx="252" cy="415" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="419" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G4</text>  <circle cx="252" cy="445" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="449" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G2</text>  <circle cx="252" cy="475" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="479" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">G15</text>  <circle cx="252" cy="505" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="509" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D1</text>  <circle cx="252" cy="535" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="539" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">D0</text>  <circle cx="252" cy="565" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="569" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">CLK</text>  <circle cx="252" cy="595" r="5" fill="#ffc107" stroke="#212529" stroke-width="1.5" />  <text x="240" y="599" text-anchor="end" font-size="12px" font-family="monospace" font-weight="normal" fill="#adb5bd">GND</text></g>

<!-- Breadboard Layout -->
<g transform="translate(420, 150)">
  <rect x="0" y="0" width="450" height="600" rx="12" fill="#f1f3f5" stroke="#ced4da" stroke-width="2" />
  <text x="180" y="30" font-size="14px" font-weight="bold" fill="#adb5bd">BREADBOARD</text>
  
  <!-- Potentiometer Component Box -->
  <g transform="translate(115, 100)">
    <rect x="0" y="0" width="220" height="280" rx="8" fill="#ffffff" stroke="#dee2e6" />
    <circle cx="110" cy="95" r="55" fill="#0d6efd" opacity="0.85" />
    <circle cx="110" cy="95" r="30" fill="#e9ecef" />
    <line x1="110" y1="95" x2="138" y2="67" stroke="#0d6efd" stroke-width="5" stroke-linecap="round" />
    
    <text x="110" y="175" text-anchor="middle" font-size="15px" font-weight="bold" fill="#212529">Potentiometer</text>
    <text x="110" y="198" text-anchor="middle" font-size="15px" font-weight="bold" fill="#0d6efd">10 kΩ</text>
    <text x="110" y="218" text-anchor="middle" font-size="11px" fill="#6c757d">หมุนปรับมุม 0° ถึง 180°</text>
    
    <!-- 3 Pins -->
    <circle cx="50" cy="255" r="6" fill="#dc3545" /><text x="50" y="275" text-anchor="middle" font-size="11px" fill="#dc3545">ขา 1 (3.3V)</text>
    <circle cx="110" cy="255" r="7" fill="#0d6efd" /><text x="110" y="275" text-anchor="middle" font-size="12px" font-weight="bold" fill="#0d6efd">Wiper (G34)</text>
    <circle cx="170" cy="255" r="6" fill="#212529" /><text x="170" y="275" text-anchor="middle" font-size="11px" fill="#212529">ขา 3 (GND)</text>
  </g>
</g>

<!-- Wire Routing -->
<!-- 1. 3V3 Pad -> POT Pin 1 (115+50+420=585, 100+255+150=505) -->
<path d="M 68 195 L 30 195 L 30 780 L 585 780 L 585 505" stroke="#dc3545" stroke-width="4.5" class="wire" />
<circle cx="68" cy="195" r="3" fill="#ffffff" />

<!-- 2. G34 Pad -> POT Wiper (115+110+420=645, 505) -->
<path d="M 68 315 L 45 315 L 45 805 L 645 805 L 645 505" stroke="#0d6efd" stroke-width="4.5" class="wire" />
<circle cx="68" cy="315" r="3" fill="#ffffff" />

<!-- 3. GND Pad -> POT Pin 3 (115+170+420=705, 505) -->
<path d="M 68 585 L 15 585 L 15 830 L 705 830 L 705 505" stroke="#212529" stroke-width="4.5" class="wire" />
<circle cx="68" cy="585" r="3" fill="#ffffff" />

<!-- Right Side Pinout Box -->
<g transform="translate(900, 150)">
  <rect x="0" y="0" width="355" height="600" rx="12" class="card" />
  <text x="25" y="35" font-size="16px" font-weight="bold" fill="#0d6efd">📋 ตารางการต่อสาย Potentiometer</text>
  
  <g transform="translate(20, 60)" font-size="13px">
    <rect x="0" y="0" width="315" height="50" rx="6" fill="#f8f9fa" stroke="#dee2e6" />
    <circle cx="15" cy="25" r="6" fill="#dc3545" />
    <text x="32" y="22" font-weight="bold" fill="#dc3545">ขา 3V3 (ESP32 ซ้ายแถว 1)</text>
    <text x="32" y="40" font-size="12px" fill="#495057">→ ขาที่ 1 ของ POT (สายสีแดง)</text>

    <rect x="0" y="65" width="315" height="50" rx="6" fill="#f8f9fa" stroke="#dee2e6" />
    <circle cx="15" cy="90" r="6" fill="#0d6efd" />
    <text x="32" y="87" font-weight="bold" fill="#0d6efd">GPIO 34 (ESP32 ซ้ายแถว 5)</text>
    <text x="32" y="105" font-size="12px" fill="#495057">→ ขากลาง Wiper (สายสีน้ำเงิน ADC1)</text>

    <rect x="0" y="130" width="315" height="50" rx="6" fill="#f8f9fa" stroke="#dee2e6" />
    <circle cx="15" cy="155" r="6" fill="#212529" />
    <text x="32" y="152" font-weight="bold" fill="#212529">GND (ESP32 ซ้ายแถว 14)</text>
    <text x="32" y="170" font-size="12px" fill="#495057">→ ขาที่ 3 ของ POT (สายสีดำ)</text>
  </g>

  <g transform="translate(20, 270)">
    <rect x="0" y="0" width="315" height="180" rx="8" fill="#fff3cd" stroke="#ffecb5" />
    <text x="15" y="25" font-size="14px" font-weight="bold" fill="#664d03">⚠️ ข้อควรระวังเรื่องแรงดันไฟฟ้า:</text>
    <text x="15" y="52" font-size="12px" fill="#664d03">• ห้ามนำขาไฟเลี้ยงของ POT ไปต่อเข้าขา 5V/VIN</text>
    <text x="15" y="74" font-size="12px" fill="#664d03">  เพราะภาค ADC1 ของ ESP32 ทนแรงดันได้สูงสุด</text>
    <text x="15" y="96" font-size="12px" font-weight="bold" fill="#dc3545">  3.3V เท่านั้น! (หากต่อ 5V ขา GPIO 34 อาจพังได้)</text>
    <text x="15" y="122" font-size="12px" fill="#664d03">• ใช้ขา 3.3V สีแดง เพื่อความปลอดภัย 100%</text>
    <text x="15" y="145" font-size="12px" fill="#664d03">• ค่า ADC ที่อ่านได้จะอยู่ในช่วง 0 ถึง 4095</text>
  </g>
</g>
</svg>
